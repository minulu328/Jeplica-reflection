<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JEPLICA SESSION</title>

  <style>
    body {
      margin: 0;
      background: #050505;
      color: #f2f2ef;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif;
      overflow-x: hidden;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 100px 24px;
    }

    .section {
      margin-bottom: 140px;
    }

    .fade {
      opacity: 0;
      transform: translateY(30px);
      transition: all 1s ease;
    }

    .fade.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .brand {
      font-size: 13px;
      letter-spacing: 0.22em;
      color: rgba(255,255,255,0.5);
      margin-bottom: 80px;
    }

    .line {
      font-size: clamp(28px, 6vw, 42px);
      line-height: 1.4;
      letter-spacing: -0.03em;
    }

    .small {
      font-size: 15px;
      color: rgba(255,255,255,0.5);
      margin-top: 20px;
    }

    .verse {
      font-size: clamp(30px, 7vw, 50px);
      line-height: 1.3;
      letter-spacing: -0.04em;
    }

    .input-wrap {
      margin-top: 40px;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      color: #f2f2ef;
      font-size: 18px;
      padding: 10px 0;
      outline: none;
      resize: none;
    }

    textarea::placeholder {
      color: rgba(255,255,255,0.3);
    }

    .end {
      font-size: 18px;
      color: rgba(255,255,255,0.6);
    }

  </style>
</head>

<body>

<div class="container">

  <div class="brand fade">JEPLICA SESSION</div>

  <div class="section fade">
    <div class="line">
      지금,<br>
      잠깐 멈춰도 괜찮다
    </div>
  </div>

  <div class="section fade">
    <div class="line">
      요즘,<br>
      계속 붙잡고 있는 것이 있다
    </div>
  </div>

  <div class="section fade">
    <div class="line">
      놓으면 불안하고<br>
      붙잡고 있으면 더 무겁다
    </div>
  </div>

  <div class="section fade">
    <div class="verse">
      “마음을 다하여 여호와를 신뢰하고<br>
      네 명철을 의지하지 말라”
    </div>
    <div class="small">잠언 3:5</div>
  </div>

  <div class="section fade">
    <div class="line">
      지금,<br>
      내가 놓지 못하는 것은 무엇일까
    </div>

    <div class="input-wrap">
      <textarea id="input" placeholder="굳이 정리하지 않아도 됩니다."></textarea>
    </div>
  </div>

  <div class="section fade">
    <div class="end">
      하나만 내려놓아도 충분하다
    </div>
  </div>

</div>

<script>
  const fades = document.querySelectorAll(".fade");

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        entry.target.classList.add("visible");
      }
    });
  }, { threshold: 0.2 });

  fades.forEach(el => observer.observe(el));

  // local 저장
  const textarea = document.getElementById("input");
  const key = "jeplica-session";

  const saved = localStorage.getItem(key);
  if(saved) textarea.value = saved;

  textarea.addEventListener("input", () => {
    localStorage.setItem(key, textarea.value);
  });
</script>

</body>
</html>
